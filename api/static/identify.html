<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Identificar · VerdES somos</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="header">
    <div class="container barra-top">
      <a href="/" class="logo">
        <img src="/static/logo_verdES.png" alt="Logo VerdES somos">
        <span>VerdES somos</span>
      </a>
      <nav>
        <a href="/">Inicio</a>
        <a href="/static/catalog.html">Catálogo</a>
        <a href="/static/identify.html">Identificar</a>
        <a href="/#manual">Cómo usarlo</a>
      </nav>
    </div>
  </header>

  <section class="hero hero-corto">
    <img class="adorno adorno-izq" src="/static/decor/marco_hojas.svg" alt="">
    <img class="adorno adorno-der" src="/static/decor/colinas.svg" alt="">
    <div class="container hero-content">
      <h1>Identificar una foto</h1>
      <p class="lead">Se compara con las fotos guardadas en la base. No adivina una planta que nunca se ha registrado.</p>
    </div>
  </section>

  <main>
    <form id="forma" class="caja cuerpo">
      <p>Elige una foto clara de la hoja, la flor o el fruto.</p>
      <input type="file" name="foto" accept="image/*" required>
      <button class="primario" type="submit">Comparar</button>
    </form>
    <div id="salida" class="grid" style="margin-top:16px"></div>
  </main>

  <img class="adorno cortina" src="/static/decor/cortina_flores.svg" alt="">

  <footer class="footer">
    <div class="container">
      <p>VerdES somos — Flora de El Salvador</p>
    </div>
  </footer>

  <script src="/static/js/main.js"></script>
  <script>
    const salida = document.getElementById("salida");
    document.getElementById("forma").onsubmit = async (evento) => {
      evento.preventDefault();
      salida.innerHTML = "<p>Comparando con la base...</p>";
      const datos = new FormData(evento.target);
      try {
        const data = await pedir("/api/identificar", { method: "POST", body: datos });
        if (!data.resultados.length) {
          salida.innerHTML = "<p>No se parece a ninguna planta registrada.</p>";
          return;
        }
        salida.innerHTML = data.resultados.map((item) =>
          `<div>${tarjeta(item.planta)}<p class="nota">Parecido aproximado: ${item.parecido}%</p></div>`
        ).join("");
      } catch (e) {
        salida.innerHTML = `<p>${e.message}</p>`;
      }
    };
  </script>
</body>
</html>
